<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Shaday Gas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a1020;color:#fff}
.h{background:#12245c;padding:12px;display:flex;gap:10px;align-items:center}
.logo{width:40px;height:40px;background:orange;border-radius:10px;display:grid;place-items:center}
.fab{position:fixed;right:18px;bottom:18px;width:65px;height:65px;border-radius:50%;background:#2f6bff;color:#fff;font-size:40px;border:0}
.card{background:#1a274d;border-radius:12px;padding:12px;margin:10px}
.item{background:#0f1a33;border-radius:10px;padding:10px;margin-top:8px}
.inp{width:100%;padding:12px;border-radius:10px;border:0;background:#0f1a33;color:#fff;margin-top:8px}
.btn{padding:8px 12px;border-radius:20px;border:0;color:#fff;font-weight:700;margin:3px}
.modal{position:fixed;inset:0;background:#000d;display:none;padding:10px;overflow:auto;z-index:99}
.modal.on{display:block}
.box{background:#1a274d;border-radius:14px;padding:14px;max-width:500px;margin:20px auto}
</style>
</head>
<body>
<div class="h"><div class="logo">🔥</div><div><b>EL SHADAY GAS</b><br><small>Clientes e Fiado</small></div></div>
<div class="card"><input id="busca" class="inp" placeholder="🔍 Buscar..." oninput="ver()"><div id="lista"></div></div>
<button class="fab" onclick="abrir()">+</button>
<div id="modal" class="modal"><div class="box">
<h3 id="tit">Novo Cliente</h3>
<input id="nome" class="inp" placeholder="Nome *">
<input id="zap" class="inp" placeholder="WhatsApp 83999999999">
<input id="end" class="inp" placeholder="Endereco">
<input id="bai" class="inp" placeholder="Bairro">
<div style="border:1px dashed #2f6bff;padding:8px;border-radius:10px;margin-top:8px">
<b style="color:#60a5fa;font-size:11px">📍 LOCALIZACAO</b><br>
<div style="display:flex;gap:6px"><input id="lat" class="inp" placeholder="Latitude"><input id="lng" class="inp" placeholder="Longitude"></div>
<button class="inp" style="background:#22c55e" onclick="gps()">📍 Usar meu GPS agora</button>
<input id="link" class="inp" placeholder="Cole link do Google Maps" oninput="linkM()">
<div id="prev" style="margin-top:6px"></div>
</div>
<input id="dev" class="inp" type="number" placeholder="Valor devendo R$">
<button class="inp" style="background:#2f6bff;font-weight:900" onclick="salvar()">💾 SALVAR CLIENTE</button>
<button class="inp" style="background:#334173" onclick="fechar()">Cancelar</button>
<button id="del" class="inp" style="background:#ef4444;display:none" onclick="excluir()">Excluir Cliente</button>
</div></div>
<script>
var cs=[];try{cs=JSON.parse(localStorage.getItem('es_v4')||'[]')}catch(e){};var edit=null;
function save(){localStorage.setItem('es_v4',JSON.stringify(cs))}
function abrir(){edit=null;document.getElementById('tit').innerText='Novo Cliente';['nome','zap','end','bai','lat','lng','link','dev'].forEach(function(i){document.getElementById(i).value=''});document.getElementById('del').style.display='none';document.getElementById('prev').innerHTML='';document.getElementById('modal').classList.add('on')}
function fechar(){document.getElementById('modal').classList.remove('on')}
function gps(){if(!navigator.geolocation){alert('Sem GPS');return}navigator.geolocation.getCurrentPosition(function(p){document.getElementById('lat').value=p.coords.latitude.toFixed(6);document.getElementById('lng').value=p.coords.longitude.toFixed(6);previa()},function(){alert('Ative o GPS')})}
function previa(){var a=document.getElementById('lat').value,b=document.getElementById('lng').value;if(!a)return;document.getElementById('prev').innerHTML='<a href="https://www.google.com/maps?q='+a+','+b+'" target="_blank" style="color:#60a5fa">📍 Ver no Maps: '+a+','+b+'</a>'}
function linkM(){var v=document.getElementById('link').value;var m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m){document.getElementById('lat').value=m[1];document.getElementById('lng').value=m[2];previa()}}
function salvar(){var n=document.getElementById('nome').value.trim();if(!n){alert('Digite o nome');return}var o={id:edit||Date.now(),nome:n,zap:document.getElementById('zap').value.replace(/\D/g,''),end:document.getElementById('end').value,bai:document.getElementById('bai').value,lat:document.getElementById('lat').value,lng:document.getElementById('lng').value,dev:parseFloat(document.getElementById('dev').value)||0};if(edit){var i=cs.findIndex(function(x){return x.id==edit});cs[i]=o}else cs.push(o);save();fechar();ver()}
function editar(id){var c=cs.find(function(x){return x.id==id});edit=id;document.getElementById('tit').innerText='Editar Cliente';document.getElementById('nome').value=c.nome;document.getElementById('zap').value=c.zap;document.getElementById('end').value=c.end;document.getElementById('bai').value=c.bai;document.getElementById('lat').value=c.lat||'';document.getElementById('lng').value=c.lng||'';document.getElementById('dev').value=c.dev;document.getElementById('del').style.display='block';previa();document.getElementById('modal').classList.add('on')}
function excluir(){if(confirm('Excluir este cliente?')){cs=cs.filter(function(x){return x.id!=edit});save();fechar();ver()}}
function ver(){var b=(document.getElementById('busca').value||'').toLowerCase();var f=cs.filter(function(c){return (c.nome+' '+c.bai+' '+c.end).toLowerCase().includes(b)});document.getElementById('lista').innerHTML=f.map(function(c){return '<div class="item" onclick="editar('+c.id+')"><b>'+c.nome+' '+(c.lat?'📍':'')+'</b><br><small>'+c.bai+' - '+c.end+' | Deve R$ '+c.dev.toFixed(2)+'</small><br><div style="margin-top:6px"><a href="https://wa.me/55'+c.zap+'" target="_blank" onclick="event.stopPropagation()" style="background:#22c55e;color:#fff;padding:6px 10px;border-radius:15px;text-decoration:none">🟢 Zap</a> '+(c.lat?'<a href="https://www.google.com/maps?q='+c.lat+','+c.lng+'" target="_blank" onclick="event.stopPropagation()" style="background:#334173;color:#fff;padding:6px 10px;border-radius:15px;text-decoration:none">📍 Ver</a> <a href="https://www.google.com/maps/dir/?api=1&destination='+c.lat+','+c.lng+'" target="_blank" onclick="event.stopPropagation()" style="background:#2f6bff;color:#fff;padding:6px 10px;border-radius:15px;text-decoration:none">🚗 Rota</a>':'')+'</div></div>'}).join('')||'<p style="text-align:center;opacity:.5;padding:20px">Nenhum cliente<br>Clique no + azul</p>'}
ver();
</script>
</body>
</html>

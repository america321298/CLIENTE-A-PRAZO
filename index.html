<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EL SHADAY - GÁS E ÁGUA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#e9e9e9;padding:0 4px 80px}
.header{background:#1a7a34;color:#fff;text-align:center;padding:10px;font-weight:900;font-size:18px;margin:0 -4px}
.box{background:#fff;border:2.5px solid #0d47a1;border-radius:10px;padding:6px;margin:6px 0}
.box-title{color:#0d47a1;font-weight:900;text-align:center;font-size:13px;margin-bottom:6px;text-transform:uppercase}
.estoque-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.est{border-radius:8px;padding:4px 2px;text-align:center;border:2px solid #0d47a1}
.est.cheio{background:#0d47a1;color:#fff}
.est.vazio{background:#e3f2fd;color:#0d47a1}
.est b{font-size:11px;display:block;line-height:1.1}
.est .num{font-size:18px;font-weight:900;margin-top:2px;display:block;color:#000}
.est input{width:86%;font-size:18px;font-weight:900;text-align:center;border:2px solid #000;border-radius:6px;padding:2px 0;margin-top:4px}
.caderno-header{background:#ffeb3b;text-align:center;font-weight:900;font-size:18px;padding:8px;border-radius:8px 8px 0 0;border:2px solid #000;border-bottom:none}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:2px solid #000;border-radius:0 0 8px 8px}
.tabela{min-width:860px}
.th{display:grid;grid-template-columns:130px 86px 52px 56px 80px 58px 58px 58px 68px;gap:3px;padding:4px;background:#fff}
.th span{padding:5px 2px;border-radius:6px;font-size:11px;font-weight:900;text-align:center;color:#fff}
.linha{display:grid;grid-template-columns:130px 86px 52px 56px 80px 58px 58px 58px 68px;gap:3px;padding:2px 4px}
.linha input,.linha select{height:40px;border:2px solid #555;border-radius:8px;text-align:center;font-weight:900;font-size:14px;width:100%;background:#fff}
.cellTotal{background:#ffeb3b;border:1.5px solid #999;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:900;font-size:13px}
.cellFiado{background:#ffcdd2;border:1.5px solid #999;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:900;font-size:13px}
.totais{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tot{display:flex;justify-content:space-between;align-items:center;padding:10px 10px;border-radius:8px;color:#fff;font-weight:900;font-size:15px}
.tot.blue{background:#1565c0}.tot.green{background:#2e7d32}.tot.purple{background:#6a1b9a}.tot.red{background:#c62828}.tot.darkblue{background:#0d47a1}
.despBox{border:2px solid #c62828;border-radius:10px;padding:6px;margin-top:8px;background:#fff}
.despGrid{display:grid;grid-template-columns:110px 1fr;gap:6px}
.despGrid input{height:44px;border:2px solid #555;border-radius:8px;padding:0 8px;font-weight:900;font-size:16px}
.botoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.btn{border:none;border-radius:8px;padding:12px 2px;color:#fff;font-weight:900;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="header">🔥 EL SHADAY GÁS E ÁGUA 💧</div>

<div class="box">
<div class="box-title">ESTOQUE - CHEIO DIMINUI SOZINHO</div>
<div class="estoque-grid">
<div class="est cheio"><b>GÁS CHEIO</b><input id="gCheio" type="number" value="200" oninput="atualizarInicial('gas')"></div>
<div class="est vazio"><b>GÁS VAZIO</b><span class="num" id="gVazio">0</span></div>
<div class="est vazio"><b>GÁS<br>VENDIDO</b><span class="num" id="gVendido">0</span></div>
<div class="est cheio"><b>ÁGUA CHEIA</b><input id="aCheia" type="number" value="150" oninput="atualizarInicial('agua')"></div>
<div class="est vazio"><b>ÁGUA<br>VAZIA</b><span class="num" id="aVazia">0</span></div>
<div class="est vazio"><b>ÁGUA<br>VENDIDA</b><span class="num" id="aVendida">0</span></div>
</div>
</div>

<div class="box" style="padding:0;border:none;background:transparent">
<div class="caderno-header">FOLHA DE CADERNO</div>
<div class="wrap"><div class="tabela">
<div class="th">
<span style="background:#ffeb3b;color:#000">Cliente</span>
<span style="background:#000">Produto</span>
<span style="background:#4caf50">Qtd</span>
<span style="background:#212121">Unit</span>
<span style="background:#ff9800;color:#000">Total</span>
<span style="background:#2196f3">PIX</span>
<span style="background:#4caf50">DH</span>
<span style="background:#9c27b0">CART</span>
<span style="background:#e53935">FIADO</span>
</div>
<div id="lista"></div>
</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<button class="btn" style="background:#29b6f6" onclick="addLinha(5)">+5 Vendas</button>
<button class="btn" style="background:#2e7d32" onclick="addLinha(1)">+1 Venda</button>
</div>

<div class="totais">
<div class="tot blue"><span>PIX: R$</span><span id="tPix">0</span></div>
<div class="tot green"><span>DH: R$</span><span id="tDH">0</span></div>
<div class="tot purple"><span>CART: R$</span><span id="tCart">0</span></div>
<div class="tot red"><span>FIADO: R$</span><span id="tFiado">0</span></div>
</div>
<div class="totais" style="grid-template-columns:1fr">
<div class="tot darkblue"><span>TOTAL GERAL: R$</span><span id="tGeral">0</span></div>
</div>

<div class="despBox">
<div class="despGrid">
<div><label>Desp. R$</label><input id="despValor" type="number" value="0" oninput="calcular()"></div>
<div><label>Motivo</label><input id="despMotivo" placeholder="Ex: Almoço" oninput="salvarDesp()"></div>
</div>
<div class="totais" style="margin-top:6px">
<div class="tot" style="background:#ef5350"><span>DESPESA: R$</span><span id="tDesp">0</span></div>
<div class="tot green"><span>LUCRO: R$</span><span id="tLucro">0</span></div>
</div>
</div>

<div class="botoes">
<button class="btn" style="background:#25d366" onclick="enviarZap()">WhatsApp</button>
<button class="btn" style="background:#0d47a1" onclick="salvarTudo()">Salvar</button>
<button class="btn" style="background:#6a1b9a" onclick="addLinha(3)">+3</button>
<button class="btn" style="background:#ef6c00" onclick="removerLinha()">-Folha</button>
<button class="btn" style="background:#000" onclick="gerarPDF()">PDF</button>
<button class="btn" style="background:#c62828" onclick="zerar()">ZERAR</button>
<button class="btn" style="background:#e65100" onclick="limpar()">Limpar</button>
<button class="btn" style="background:#607d8b" onclick="location.reload()">Atualizar</button>
</div>
</div>

<script>
let estoqueInicialGas=200, estoqueInicialAgua=150, dados=[];
function iniciar(){
  estoqueInicialGas=parseInt(localStorage.getItem('estGasInicial')||'200');
  estoqueInicialAgua=parseInt(localStorage.getItem('estAguaInicial')||'150');
  dados=JSON.parse(localStorage.getItem('dadosFolha')||'[]');
  if(dados.length===0){for(let i=0;i<3;i++) dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});}
  document.getElementById('despValor').value=localStorage.getItem('despValor')||0;
  document.getElementById('despMotivo').value=localStorage.getItem('despMotivo')||'';
  montar();
}
function salvarDesp(){
  localStorage.setItem('despValor',document.getElementById('despValor').value);
  localStorage.setItem('despMotivo',document.getElementById('despMotivo').value);
}
function atualizarInicial(tipo){
  const v=getVendidos();
  if(tipo==='gas'){
    let restante=Number(document.getElementById('gCheio').value)||0;
    estoqueInicialGas=restante+v.g;
    localStorage.setItem('estGasInicial',estoqueInicialGas);
  }else{
    let restante=Number(document.getElementById('aCheia').value)||0;
    estoqueInicialAgua=restante+v.a;
    localStorage.setItem('estAguaInicial',estoqueInicialAgua);
  }
  calcular(false);
}
function getVendidos(){
  let g=0,a=0;
  document.querySelectorAll('#lista .linha').forEach(l=>{
    let q=Number(l.querySelector('.cQtd').value)||0;
    let p=l.querySelector('.cProd').value;
    if(p==='G') g+=q; else a+=q;
  });
  return {g,a};
}
function montar(){
  let html='';
  dados.forEach((v,i)=>{
    html+=`<div class="linha">
      <input class="cCliente" value="${(v.cliente||'').replace(/"/g,'&quot;')}" placeholder="Cliente" oninput="calcular()">
      <select class="cProd" onchange="calcular()"><option value="G" ${v.prod!=='A'?'selected':''}>GÁS</option><option value="A" ${v.prod==='A'?'selected':''}>ÁGUA</option></select>
      <input class="cQtd" type="number" value="${v.qtd||''}" placeholder="0" oninput="calcular()">
      <input class="cUnit" type="number" value="${v.unit||''}" placeholder="0" oninput="calcular()">
      <div class="cellTotal" id="t${i}">R$0</div>
      <input class="cPix" type="number" value="${v.pix||''}" placeholder="0" oninput="calcular()">
      <input class="cDh" type="number" value="${v.dh||''}" placeholder="0" oninput="calcular()">
      <input class="cCart" type="number" value="${v.cart||''}" placeholder="0" oninput="calcular()">
      <div class="cellFiado" id="f${i}">R$0</div>
    </div>`;
  });
  document.getElementById('lista').innerHTML=html;
  calcular(true);
}
function addLinha(n){salvarNaMemoria();for(let i=0;i<n;i++) dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});montar();}
function removerLinha(){salvarNaMemoria();if(dados.length>1){dados.pop();montar();}}
function salvarNaMemoria(){
  let novo=[];
  document.querySelectorAll('#lista .linha').forEach(l=>{
    novo.push({cliente:l.querySelector('.cCliente').value,prod:l.querySelector('.cProd').value,qtd:l.querySelector('.cQtd').value,unit:l.querySelector('.cUnit').value,pix:l.querySelector('.cPix').value,dh:l.querySelector('.cDh').value,cart:l.querySelector('.cCart').value});
  });
  dados=novo;localStorage.setItem('dadosFolha',JSON.stringify(dados));
}
function calcular(atualizaEstoque=true){
  let gVend=0,aVend=0,tGeral=0,tPix=0,tDH=0,tCart=0,tFiado=0;
  document.querySelectorAll('#lista .linha').forEach((l,i)=>{
    let q=Number(l.querySelector('.cQtd').value)||0;
    let u=Number(l.querySelector('.cUnit').value)||0;
    let pix=Number(l.querySelector('.cPix').value)||0;
    let dh=Number(l.querySelector('.cDh').value)||0;
    let cart=Number(l.querySelector('.cCart').value)||0;
    let prod=l.querySelector('.cProd').value;
    let tot=q*u;
    let fiado=tot-pix-dh-cart; if(fiado<0) fiado=0;
    if(prod==='G') gVend+=q; else aVend+=q;
    tGeral+=tot; tPix+=pix; tDH+=dh; tCart+=cart; tFiado+=fiado;
    document.getElementById('t'+i).innerText='R$'+tot;
    document.getElementById('f'+i).innerText='R$'+fiado;
    document.getElementById('f'+i).style.background=fiado>0?'#ffcdd2':'#c8e6c9';
  });
  if(atualizaEstoque){
    let restoG=estoqueInicialGas-gVend;
    let restoA=estoqueInicialAgua-aVend;
    if(document.activeElement.id!=='gCheio') document.getElementById('gCheio').value=restoG<0?0:restoG;
    if(document.activeElement.id!=='aCheia') document.getElementById('aCheia').value=restoA<0?0:restoA;
  }
  document.getElementById('gVazio').innerText=gVend;
  document.getElementById('gVendido').innerText=gVend;
  document.getElementById('aVazia').innerText=aVend;
  document.getElementById('aVendida').innerText=aVend;
  document.getElementById('tPix').innerText=tPix;
  document.getElementById('tDH').innerText=tDH;
  document.getElementById('tCart').innerText=tCart;
  document.getElementById('tFiado').innerText=tFiado;
  document.getElementById('tGeral').innerText=tGeral;
  let desp=Number(document.getElementById('despValor').value)||0;
  document.getElementById('tDesp').innerText=desp;
  document.getElementById('tLucro').innerText=(tPix+tDH+tCart)-desp;
  salvarNaMemoria(); salvarDesp();
}
function salvarTudo(){calcular();alert('Salvo!');}
function zerar(){if(confirm('Zerar folha de hoje?')){dados=[];for(let i=0;i<3;i++)dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});localStorage.setItem('dadosFolha',JSON.stringify(dados));montar();}}
function limpar(){if(confirm('Limpar tudo?')){localStorage.clear();location.reload();}}

// WHATSAPP IGUAL PDF - SEM CORAÇÃO AZUL/VERMELHO - COM TOTAL EM PIX E DH
function enviarZap(){
  let data=new Date().toLocaleDateString('pt-BR');
  let tg=0,tp=0,td=0,tc=0,tf=0,tGeral=0;
  let linhas=[];let devedores=[];
  
  document.querySelectorAll('#lista .linha').forEach(l=>{
    let c=l.querySelector('.cCliente').value||'';let q=Number(l.querySelector('.cQtd').value)||0;
    if(!q)return;
    let p=l.querySelector('.cProd').value;let u=l.querySelector('.cUnit').value||0;
    let tot=l.querySelector('.cellTotal').innerText;let pix=Number(l.querySelector('.cPix').value)||0;
    let dh=Number(l.querySelector('.cDh').value)||0;let cart=Number(l.querySelector('.cCart').value)||0;
    let fi=Number((l.querySelector('.cellFiado').innerText||'').replace('R$',''))||0;
    tg+=q;tp+=pix;td+=dh;tc+=cart;tf+=fi;tGeral+=Number(tot.replace('R$',''));
    
    let detalhe='';
    if(pix>0) detalhe+=`PIX R$${pix} `;
    if(dh>0) detalhe+=`DH R$${dh} `;
    if(cart>0) detalhe+=`CART R$${cart} `;
    if(fi>0 && pix==0 && dh==0 && cart==0) detalhe+=`FIADO R$${fi}`;
    
    if(detalhe.trim()) linhas.push(`${c} - ${q}x ${p} = ${tot} (${detalhe.trim()})`);
    else linhas.push(`${c} - ${q}x ${p} = ${tot}`);
    
    if(fi>0) devedores.push(`${c} - R$${fi}`);
  });
  
  if(!linhas.length){alert('Sem vendas');return;}
  
  let txt=`🔥 EL SHADAY - ${data} - GAS: ${tg} 💧\n`;
  txt+=`${linhas.join('\n')}\n\n`;
  txt+=`📦 GAS VENDIDO QTD: ${tg} unid.\n\n`;
  txt+=`VALOR EM PIX: R$ ${tp}\n\n`;
  txt+=`VALOR EM DH: R$ ${td}\n\n`;
  txt+=`VALOR EM CART: R$ ${tc}\n\n`;
  txt+=`A RECEBER (FIADO): R$ ${tf}\n\n`;
  txt+=`TOTAL GERAL: R$ ${tGeral}\n\n`;
  txt+=`QUEM ESTA DEVENDO:\n${devedores.length?devedores.join(' | '):'Nenhum'}`;
  
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

// PDF LEGIVEL - 4 POTINHOS GRANDES
function gerarPDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF('l','mm','a4');
  let rows=[], listaFiado=[], tg=0,ta=0,tp=0,td=0,tc=0,tf=0,tgGeral=0;
  document.querySelectorAll('#lista .linha').forEach(l=>{
    let c=l.querySelector('.cCliente').value||'Sem nome';
    let p=l.querySelector('.cProd').value; let q=Number(l.querySelector('.cQtd').value)||0;
    let u=l.querySelector('.cUnit').value||0;
    let tot=Number(l.querySelector('.cellTotal').innerText.replace('R$',''))||0;
    let pix=Number(l.querySelector('.cPix').value)||0; let dh=Number(l.querySelector('.cDh').value)||0;
    let cart=Number(l.querySelector('.cCart').value)||0; let fi=Number(l.querySelector('.cellFiado').innerText.replace('R$',''))||0;
    if(q>0){
      if(p==='G') tg+=q; else ta+=q;
      tp+=pix; td+=dh; tc+=cart; tf+=fi; tgGeral+=tot;
      if(fi>0) listaFiado.push(`${c} - R$${fi}`);
      rows.push([c,p,q,'R$'+u,'R$'+tot,'R$'+pix,'R$'+dh,'R$'+cart,'R$'+fi]);
    }
  });
  if(!rows.length){alert('Sem vendas');return;}
  doc.setFontSize(14);doc.setFont(undefined,'bold');
  doc.text(`EL SHADAY - ${new Date().toLocaleDateString('pt-BR')} - GAS: ${tg} AGUA: ${ta} - TOTAL R$${tgGeral}`,14,12);
  doc.autoTable({
    head:[['Cliente','Prod','Qtd','Unit','Total','PIX','DH','CART','FIADO']],
    body:rows,startY:16,
    styles:{fontSize:13,halign:'center',valign:'middle',lineWidth:0.5,lineColor:[0,0,0],cellPadding:4,fontStyle:'bold'},
    headStyles:{fillColor:[13,71,161],fontSize:12,halign:'center'},
  });
  let y=doc.lastAutoTable.finalY+10;let W=277,gap=10,bw=(W-30-gap*2)/3,bh=32,x=15;
  doc.setFillColor(198,40,40);doc.rect(x,y,bw,bh,'F');doc.setDrawColor(0);doc.setLineWidth(0.6);doc.rect(x,y,bw,bh,'S');
  doc.setTextColor(255);doc.setFontSize(12);doc.setFont(undefined,'bold');doc.text('GAS VENDIDO QTD',x+5,y+10);doc.setFontSize(18);doc.text(tg+' unid.',x+5,y+23);
  doc.setFillColor(2,136,209);doc.rect(x+bw+gap,y,bw,bh,'F');doc.rect(x+bw+gap,y,bw,bh,'S');doc.setFontSize(12);doc.text('VALOR EM PIX',x+bw+gap+5,y+10);doc.setFontSize(18);doc.text('R$ '+tp,x+bw+gap+5,y+23);
  doc.setFillColor(183,28,28);doc.rect(x+(bw+gap)*2,y,bw,bh,'F');doc.rect(x+(bw+gap)*2,y,bw,bh,'S');doc.setFontSize(12);doc.text('A RECEBER (FIADO)',x+(bw+gap)*2+5,y+10);doc.setFontSize(18);doc.text('R$ '+tf,x+(bw+gap)*2+5,y+23);
  y+=bh+10;doc.setFillColor(66,66,66);doc.rect(x,y,W-30,36,'F');doc.rect(x,y,W-30,36,'S');doc.setTextColor(255);doc.setFontSize(12);doc.text('QUEM ESTA DEVENDO - TOTAL R$'+tf,x+5,y+11);doc.setFontSize(11);doc.setFont(undefined,'normal');let txtDev=listaFiado.length?listaFiado.join(' | '):'Nenhum';let lin=doc.splitTextToSize(txtDev,W-40);doc.text(lin,x+5,y+20);
  doc.save(`elshaday-${new Date().toLocaleDateString('pt-BR')}.pdf`);
}
window.onload=iniciar;
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentEl

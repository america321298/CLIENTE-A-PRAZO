<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>EL SHADAY FINAL FIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f0f0}
.titulo{background:#1a7a34;color:#fff;text-align:center;padding:8px;font-weight:bold}
.estoque{margin:4px;background:#fff;border-radius:8px;padding:6px;border:2px solid #0d47a1}
.linha-unica{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:4px}
.top{padding:6px;border-radius:6px;text-align:center;font-size:9px;font-weight:bold;color:#fff}
.top b{font-size:18px;display:block;color:#000;margin-top:2px}
.top input{width:100%;background:#fff;color:#000;border:2px solid #000;border-radius:5px;text-align:center;font-size:20px;font-weight:bold;padding:4px}
.top.gas{background:#0d47a1}.top.agua{background:#0288d1}
.top.white-gas{background:#e3f2fd;color:#0d47a1;border:1.5px solid #0d47a1}
.top.white-agua{background:#e1f5fe;color:#0288d1;border:1.5px solid #0288d1}
.card{margin:4px;background:#fff;border-radius:8px;padding:4px;border:1.5px solid #0d47a1}
.wrap{overflow-x:auto}.tabela{min-width:850px}
.th{display:grid;grid-template-columns:120px 70px 50px 55px 75px 55px 55px 55px 55px;gap:3px;font-size:10px;font-weight:bold;text-align:center}
.th span{padding:6px;border-radius:4px;color:#fff}
.linha{display:grid;grid-template-columns:120px 70px 50px 55px 75px 55px 55px 55px 55px;gap:3px;margin:3px 0}
.linha input,.linha select{height:42px;border:2px solid #333;border-radius:6px;text-align:center;font-size:15px;font-weight:bold;width:100%}
.totalCell{background:#ffeb3b;height:42px;display:flex;align-items:center;justify-content:center;border:2px solid #000;border-radius:6px;font-weight:bold;font-size:13px}
.fiCell{background:#ffcdd2;height:42px;display:flex;align-items:center;justify-content:center;border:2px solid #000;border-radius:6px;font-weight:bold;font-size:13px}
.sum{padding:10px;border-radius:6px;color:#fff;font-weight:bold;display:flex;justify-content:space-between;margin:3px;font-size:14px}
.btn{border:none;border-radius:8px;padding:14px 4px;color:#fff;font-weight:bold;font-size:13px}
.bot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px}
.hist{margin:4px;background:#fff;border-radius:8px;padding:8px;border:2px solid #7b1fa2;display:none}
</style>
</head>
<body>
<div class="titulo">🔥 EL SHADAY GÁS E ÁGUA 💧 - VERSÃO FINAL</div>
<div class="estoque">
<div style="text-align:center;font-size:11px;font-weight:bold;color:#0d47a1">ESTOQUE - CHEIO DIMINUI SOZINHO</div>
<div class="linha-unica">
<div class="top gas">GÁS CHEIO<input id="gCheio" type="number" value="200" oninput="salvarEst()"></div>
<div class="top white-gas">GÁS VAZIO<b id="gVazio">0</b></div>
<div class="top white-gas">GÁS VENDIDO<b id="gVendido">0</b></div>
<div class="top agua">ÁGUA CHEIA<input id="aCheia" type="number" value="150" oninput="salvarEst()"></div>
<div class="top white-agua">ÁGUA VAZIA<b id="aVazia">0</b></div>
<div class="top white-agua">ÁGUA VENDIDA<b id="aVendida">0</b></div>
</div>
</div>
<div class="card">
<div class="wrap"><div class="tabela">
<div class="th">
<span style="background:#ffeb3b;color:#000">Cliente</span><span style="background:#000">Produto</span><span style="background:#4caf50">Qtd</span><span style="background:#222">Unit</span><span style="background:#ff9800;color:#000">Total</span><span style="background:#2196f3">PIX</span><span style="background:#4caf50">DH</span><span style="background:#9c27b0">CART</span><span style="background:#e53935">FIADO</span>
</div>
<div id="lista"></div>
</div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px">
<div class="sum" style="background:#1565c0">PIX: R$<span id="sPix">0</span></div>
<div class="sum" style="background:#2e7d32">DH: R$<span id="sDH">0</span></div>
<div class="sum" style="background:#7b1fa2">CART: R$<span id="sCart">0</span></div>
<div class="sum" style="background:#c62828">FIADO: R$<span id="sFiado">0</span></div>
<div class="sum" style="background:#0d47a1;grid-column:span 2">TOTAL GERAL: R$<span id="sGeral">0</span></div>
</div>
<div style="margin:4px;background:#fff;border:2px solid #e53935;border-radius:8px;padding:6px">
<div style="display:grid;grid-template-columns:100px 1fr;gap:6px">
<div>Desp. R$<br><input id="despValor" type="number" value="0" style="width:100%;padding:10px;border:2px solid #999;border-radius:5px;font-weight:bold" oninput="calc()"></div>
<div>Motivo<br><input id="despMotivo" type="text" placeholder="Ex: Almoço" style="width:100%;padding:10px;border:2px solid #999;border-radius:5px"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<div class="sum" style="background:#ef5350">DESPESA: R$<span id="sDesp">0</span></div>
<div class="sum" style="background:#2e7d32">LUCRO: R$<span id="sLucro">0</span></div>
</div>
</div>
<div class="bot">
<button class="btn" style="background:#25D366" onclick="zap()">WhatsApp</button>
<button class="btn" style="background:#0d47a1" onclick="salvarDia()">Salvar</button>
<button class="btn" style="background:#7b1fa2" onclick="verHist()">Historico</button>
<button class="btn" style="background:#ef6c00" onclick="rem()">-Folha</button>
<button class="btn" style="background:#000" onclick="pdf()">PDF</button>
<button class="btn" style="background:#2e7d32" onclick="addLinha(3)">+3</button>
<button class="btn" style="background:#c62828" onclick="zerar()">ZERAR</button>
<button class="btn" style="background:#e64a19" onclick="limparTudo()">Limpar</button>
</div>
<div class="hist" id="histCard">
<div style="display:flex;justify-content:space-between;font-weight:bold"><span>HISTÓRICO</span><button onclick="document.getElementById('histCard').style.display='none'" style="background:red;color:#fff;border:none;padding:5px 12px;border-radius:5px">X</button></div>
<div id="histLista"></div>
</div>
<script>
let EST_GAS = 200;
let EST_AGUA = 150;

function iniciar(){
  let eg = localStorage.getItem('EST_GAS_FINAL');
  let ea = localStorage.getItem('EST_AGUA_FINAL');
  if(eg) EST_GAS = parseInt(eg);
  if(ea) EST_AGUA = parseInt(ea);
  document.getElementById('gCheio').value = EST_GAS;
  document.getElementById('aCheia').value = EST_AGUA;

  let salvos = localStorage.getItem('FOLHA_FINAL_V2');
  let arr = [];
  if(salvos){
    try{ arr = JSON.parse(salvos); }catch(e){ arr=[]; }
  }
  if(arr.length==0){
    for(let i=0;i<5;i++) arr.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});
  }
  render(arr);
}

function render(arr){
  let html='';
  arr.forEach((v,i)=>{
    html+=`<div class="linha">
    <input class="cCli" value="${v.cliente||''}" placeholder="Cliente" oninput="calc()">
    <select class="cProd" onchange="calc()"><option value="G" ${v.prod=='G'?'selected':''}>GÁS</option><option value="A" ${v.prod=='A'?'selected':''}>ÁGUA</option></select>
    <input class="cQtd" type="number" value="${v.qtd||''}" placeholder="0" oninput="calc()">
    <input class="cUnit" type="number" value="${v.unit||''}" placeholder="0" oninput="calc()">
    <div class="totalCell" id="t${i}">R$0</div>
    <input class="cPix" type="number" value="${v.pix||''}" placeholder="0" oninput="calc()">
    <input class="cDh" type="number" value="${v.dh||''}" placeholder="0" oninput="calc()">
    <input class="cCart" type="number" value="${v.cart||''}" placeholder="0" oninput="calc()">
    <div class="fiCell" id="f${i}">R$0</div>
    </div>`;
  });
  document.getElementById('lista').innerHTML=html;
  calc();
}

function addLinha(n){
  let linhas = document.querySelectorAll('#lista .linha');
  let arr=[];
  linhas.forEach(l=>{
    arr.push({cliente:l.querySelector('.cCli').value, prod:l.querySelector('.cProd').value, qtd:l.querySelector('.cQtd').value, unit:l.querySelector('.cUnit').value, pix:l.querySelector('.cPix').value, dh:l.querySelector('.cDh').value, cart:l.querySelector('.cCart').value});
  });
  for(let i=0;i<n;i++) arr.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});
  render(arr);
}
function rem(){
  let linhas = document.querySelectorAll('#lista .linha');
  if(linhas.length<=1) return;
  let arr=[];
  for(let i=0;i<linhas.length-1;i++){
    let l=linhas[i];
    arr.push({cliente:l.querySelector('.cCli').value, prod:l.querySelector('.cProd').value, qtd:l.querySelector('.cQtd').value, unit:l.querySelector('.cUnit').value, pix:l.querySelector('.cPix').value, dh:l.querySelector('.cDh').value, cart:l.querySelector('.cCart').value});
  }
  render(arr);
}
function salvarEst(){
  let gCheioInput = parseInt(document.getElementById('gCheio').value)||0;
  let aCheiaInput = parseInt(document.getElementById('aCheia').value)||0;
  let gVend = parseInt(document.getElementById('gVendido').innerText)||0;
  let aVend = parseInt(document.getElementById('aVendida').innerText)||0;
  // O inicial é o que está na tela + o que já vendeu
  EST_GAS = gCheioInput + gVend;
  EST_AGUA = aCheiaInput + aVend;
  localStorage.setItem('EST_GAS_FINAL', EST_GAS);
  localStorage.setItem('EST_AGUA_FINAL', EST_AGUA);
  calc();
}

function calc(){
  let linhas = document.getElementById('lista').children;
  let gVend=0, aVend=0, sPix=0, sDh=0, sCart=0, sFiado=0, sGeral=0;
  let paraSalvar=[];

  for(let i=0;i<linhas.length;i++){
    let l = linhas[i];
    let qtd = Number(l.querySelector('.cQtd').value) || 0;
    let unit = Number(l.querySelector('.cUnit').value) || 0;
    let pix = Number(l.querySelector('.cPix').value) || 0;
    let dh = Number(l.querySelector('.cDh').value) || 0;
    let cart = Number(l.querySelector('.cCart').value) || 0;
    let prod = l.querySelector('.cProd').value;
    let cliente = l.querySelector('.cCli').value;

    let tot = qtd * unit;
    let fiado = tot - pix - dh - cart;
    if(fiado < 0) fiado = 0;

    if(prod==='G') gVend += qtd; else aVend += qtd;
    sPix+=pix; sDh+=dh; sCart+=cart; sFiado+=fiado; sGeral+=tot;

    document.getElementById('t'+i).innerText = 'R$' + tot;
    document.getElementById('f'+i).innerText = 'R$' + fiado;

    paraSalvar.push({cliente,prod,qtd:l.querySelector('.cQtd').value,unit:l.querySelector('.cUnit').value,pix:l.querySelector('.cPix').value,dh:l.querySelector('.cDh').value,cart:l.querySelector('.cCart').value});
  }

  let restoGas = EST_GAS - gVend;
  let restoAgua = EST_AGUA - aVend;

  if(document.activeElement.id !== 'gCheio') document.getElementById('gCheio').value = restoGas;
  if(document.activeElement.id !== 'aCheia') document.getElementById('aCheia').value = restoAgua;

  document.getElementById('gVazio').innerText = gVend;
  document.getElementById('gVendido').innerText = gVend;
  document.getElementById('aVazia').innerText = aVend;
  document.getElementById('aVendida').innerText = aVend;

  document.getElementById('sPix').innerText = sPix;
  document.getElementById('sDH').innerText = sDh;
  document.getElementById('sCart').innerText = sCart;
  document.getElementById('sFiado').innerText = sFiado;
  document.getElementById('sGeral').innerText = sGeral;

  let desp = Number(document.getElementById('despValor').value)||0;
  document.getElementById('sDesp').innerText = desp;
  document.getElementById('sLucro').innerText = (sPix+sDh+sCart-desp);

  localStorage.setItem('FOLHA_FINAL_V2', JSON.stringify(paraSalvar));
}

function zerar(){
  if(confirm('Zerar folha?')){
    localStorage.removeItem('FOLHA_FINAL_V2');
    render([{},{},{},{},{}].map(()=>({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''})));
  }
}
function limparTudo(){ if(confirm('Limpar tudo?')){ localStorage.clear(); location.reload(); } }
function salvarDia(){
  let h = JSON.parse(localStorage.getItem('HIST_FINAL')||'{}');
  let hoje = new Date().toISOString().slice(0,10);
  h[hoje]={gas:document.getElementById('gVendido').innerText, agua:document.getElementById('aVendida').innerText, total:document.getElementById('sGeral').innerText, desp:document.getElementById('despValor').value, motivo:document.getElementById('despMotivo').value};
  localStorage.setItem('HIST_FINAL', JSON.stringify(h));
  alert('Salvo '+hoje);
  verHist();
}
function verHist(){
  let c=document.getElementById('histCard');
  c.style.display=c.style.display=='block'?'none':'block';
  let h=JSON.parse(localStorage.getItem('HIST_FINAL')||'{}');
  let html='';
  Object.keys(h).reverse().forEach(d=>{
    let v=h[d];
    html+=`<div style="padding:6px;border-bottom:1px solid #ccc">${d.split('-').reverse().join('/')} - GAS ${v.gas} AGUA ${v.agua} TOTAL R$${v.total} DESP R$${v.desp} ${v.motivo}</div>`;
  });
  document.getElementById('histLista').innerHTML=html||'Vazio';
}
function zap(){
  let m=`*EL SHADAY* ${new Date().toLocaleDateString()}\nGAS Cheio ${document.getElementById('gCheio').value} Vendido ${document.getElementById('gVendido').innerText} | AGUA ${document.getElementById('aCheia').value} Vendida ${document.getElementById('aVendida').innerText}\n\n`;
  document.querySelectorAll('#lista .linha').forEach(l=>{
    let cl=l.querySelector('.cCli').value;
    let pr=l.querySelector('.cProd').value;
    let q=l.querySelector('.cQtd').value;
    let u=l.querySelector('.cUnit').value;
    let t=l.querySelector('.totalCell').innerText;
    if(q) m+=`${cl} ${pr} ${q}x${u}=${t}\n`;
  });
  m+=`\nPIX R$${document.getElementById('sPix').innerText} DH R$${document.getElementById('sDH').innerText} CART R$${document.getElementById('sCart').innerText} FIADO R$${document.getElementById('sFiado').innerText} TOTAL R$${document.getElementById('sGeral').innerText}`;
  window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank');
}
function pdf(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('l','mm','a4');
  let rows=[];
  document.querySelectorAll('#lista .linha').forEach(l=>{
    let c=l.querySelector('.cCli').value||'Cliente';
    let p=l.querySelector('.cProd').value;
    let q=l.querySelector('.cQtd').value;
    let u=l.querySelector('.cUnit').value;
    let t=l.querySelector('.totalCell').innerText;
    if(q) rows.push([c,p,q,u,t,l.querySelector('.cPix').value,l.querySelector('.cDh').value,l.querySelector('.cCart').value,l.querySelector('.fiCell').innerText]);
  });
  if(!rows.length){alert('Sem vendas');return;}
  doc.text('EL SHADAY '+new Date().toLocaleDateString(),14,10);
  doc.autoTable({head:[['Cli','Prod','Qtd','Unit','Total','PIX','DH','CART','FIADO']],body:rows,startY:14});
  doc.save('elshaday.pdf');
}
window.onload=iniciar;
</script>
</body>
</html>

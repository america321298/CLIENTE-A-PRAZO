<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>EL SHADAY GÁS E ÁGUA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f0f0}
.titulo{background:#1a7a34;color:#fff;text-align:center;padding:8px;font-weight:bold}
.estoque{margin:4px;background:#fff;border-radius:8px;padding:6px;border:2px solid #0d47a1}
.linha-unica{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:4px}
.top{padding:6px;border-radius:6px;text-align:center;font-size:8px;font-weight:bold;color:#fff}
.top b{font-size:15px;display:block;margin-top:2px}
.top input{width:100%;background:#fff;color:#000;border:2px solid #000;border-radius:4px;text-align:center;font-size:18px;font-weight:bold;padding:3px;margin-top:3px}
.top.gas{background:#0d47a1}.top.agua{background:#0288d1}
.top.white-gas{background:#e3f2fd;color:#0d47a1;border:1.5px solid #0d47a1}
.top.white-agua{background:#e1f5fe;color:#0288d1;border:1.5px solid #0288d1}
.top.white-gas b,.top.white-agua b{color:#000;font-size:16px}
.card{margin:4px;background:#fff;border-radius:8px;padding:4px;border:1.5px solid #0d47a1}
.wrap{overflow-x:auto}.tabela{width:100%;min-width:760px}
.th{display:grid;grid-template-columns:100px 70px 44px 48px 58px 42px 42px 42px 48px;gap:2px;font-size:8px;font-weight:bold;text-align:center}
.th span{padding:4px;border-radius:4px;color:#fff}
.linha{display:grid;grid-template-columns:100px 70px 44px 48px 58px 42px 42px 42px 48px;gap:2px;margin:2px 0}
.linha input,.linha select{height:36px;border:1.5px solid #888;border-radius:5px;text-align:center;font-size:12px;font-weight:bold;width:100%}
.totalCell{background:#ffeb3b;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #999;border-radius:5px;font-weight:bold;font-size:11px}
.fiCell{background:#ffcdd2;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #999;border-radius:5px;font-weight:bold;font-size:11px}
.sum{padding:8px;border-radius:6px;color:#fff;font-weight:bold;display:flex;justify-content:space-between;margin:2px;font-size:13px}
.btn{border:none;border-radius:6px;padding:10px 4px;color:#fff;font-weight:bold;font-size:11px}
.bot{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px}
</style>
</head>
<body>
<div class="titulo">🔥 EL SHADAY GÁS E ÁGUA 💧</div>
<div class="estoque">
<div style="font-size:11px;font-weight:bold;text-align:center;margin-bottom:4px;color:#0d47a1">ESTOQUE - CHEIO DIMINUI SOZINHO</div>
<div class="linha-unica">
<div class="top gas">GÁS CHEIO<input id="gCheio" type="number" value="200" oninput="salvarEstoque()"></div>
<div class="top white-gas">GÁS VAZIO<b id="gVazio">0</b></div>
<div class="top white-gas">GÁS VENDIDO<b id="gVendido">0</b></div>
<div class="top agua">ÁGUA CHEIA<input id="aCheia" type="number" value="150" oninput="salvarEstoque()"></div>
<div class="top white-agua">ÁGUA VAZIA<b id="aVazia">0</b></div>
<div class="top white-agua">ÁGUA VENDIDA<b id="aVendida">0</b></div>
</div>
</div>
<div class="card">
<div style="background:#ffeb3b;text-align:center;font-weight:bold;padding:6px;border-radius:6px">FOLHA DE CADERNO</div>
<div class="wrap"><div class="tabela">
<div class="th">
<span style="background:#ffeb3b;color:#000">Cliente</span><span style="background:#000">Produto</span><span style="background:#4caf50">Qtd</span><span style="background:#222">Unit</span><span style="background:#ff9800;color:#000">Total</span><span style="background:#2196f3">PIX</span><span style="background:#4caf50">DH</span><span style="background:#9c27b0">CART</span><span style="background:#e53935">FIADO</span>
</div>
<div id="lista"></div>
</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<button class="btn" style="background:#29b6f6" onclick="addLinha(5)">+5 Vendas</button>
<button class="btn" style="background:#2e7d32" onclick="addLinha(1)">+1 Venda</button>
</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px">
<div class="sum" style="background:#1565c0">PIX: R$<span id="sPix">0</span></div>
<div class="sum" style="background:#2e7d32">DH: R$<span id="sDH">0</span></div>
<div class="sum" style="background:#7b1fa2">CART: R$<span id="sCart">0</span></div>
<div class="sum" style="background:#c62828">FIADO: R$<span id="sFiado">0</span></div>
<div class="sum" style="background:#0d47a1;grid-column:span 2">TOTAL GERAL: R$<span id="sGeral">0</span></div>
</div>
<div style="margin:4px;background:#fff;border:2px solid #e53935;border-radius:8px;padding:6px">
<div style="display:grid;grid-template-columns:100px 1fr;gap:6px">
<div>Desp. R$<br><input id="despValor" type="number" value="0" style="width:100%;padding:8px;border-radius:4px;border:1.5px solid #999;font-weight:bold" oninput="calcular()"></div>
<div>Motivo<br><input id="despMotivo" type="text" placeholder="Ex: Almoço" style="width:100%;padding:8px;border-radius:4px;border:1.5px solid #999"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<div class="sum" style="background:#ef5350">DESPESA: R$<span id="sDesp">0</span></div>
<div class="sum" style="background:#2e7d32">LUCRO: R$<span id="sLucro">0</span></div>
</div>
</div>
<div class="bot">
<button class="btn" style="background:#25D366" onclick="zap()">WhatsApp</button>
<button class="btn" style="background:#0d47a1" onclick="salvar()">Salvar</button>
<button class="btn" style="background:#7b1fa2" onclick="addLinha(3)">+3</button>
<button class="btn" style="background:#ef6c00" onclick="remover()">-Folha</button>
<button class="btn" style="background:#000" onclick="gerarPDF()">PDF</button>
<button class="btn" style="background:#c62828" onclick="zerar()">ZERAR</button>
<button class="btn" style="background:#e64a19" onclick="limparTudo()">Limpar</button>
<button class="btn" style="background:#607d8b" onclick="location.reload()">Atualizar</button>
</div>
<script>
let estoqueInicialGas=200,estoqueInicialAgua=150,dados=[];
function iniciar(){
  estoqueInicialGas=parseInt(localStorage.getItem('estGas')||'200');
  estoqueInicialAgua=parseInt(localStorage.getItem('estAgua')||'150');
  document.getElementById('gCheio').value=estoqueInicialGas;
  document.getElementById('aCheia').value=estoqueInicialAgua;
  dados=JSON.parse(localStorage.getItem('dadosFolha')||'[]');
  if(dados.length==0){for(let i=0;i<5;i++)dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});}
  montar();
}
function salvarEstoque(){
  let gVend=0,aVend=0;
  document.querySelectorAll('#lista.linha').forEach(l=>{
    let q=Number(l.querySelector('.cQtd').value)||0;
    if(l.querySelector('.cProd').value=='G')gVend+=q;else aVend+=q;
  });
  estoqueInicialGas=(Number(document.getElementById('gCheio').value)||0)+gVend;
  estoqueInicialAgua=(Number(document.getElementById('aCheia').value)||0)+aVend;
  localStorage.setItem('estGas',estoqueInicialGas);
  localStorage.setItem('estAgua',estoqueInicialAgua);
  calcular();
}
function salvarNaMemoria(){
  let novo=[];
  document.querySelectorAll('#lista.linha').forEach(l=>{
    novo.push({cliente:l.querySelector('.cCliente').value,prod:l.querySelector('.cProd').value,qtd:l.querySelector('.cQtd').value,unit:l.querySelector('.cUnit').value,pix:l.querySelector('.cPix').value,dh:l.querySelector('.cDh').value,cart:l.querySelector('.cCart').value});
  });
  dados=novo;
  localStorage.setItem('dadosFolha',JSON.stringify(dados));
}
function montar(){
  let html='';
  dados.forEach((v,i)=>{
    html+=`<div class="linha">
      <input class="cCliente" value="${v.cliente||''}" placeholder="Cliente" oninput="calcular()">
      <select class="cProd" onchange="calcular()"><option value="G" ${v.prod=='G'?'selected':''}>GÁS</option><option value="A" ${v.prod=='A'?'selected':''}>ÁGUA</option></select>
      <input class="cQtd" type="number" value="${v.qtd||''}" placeholder="0" oninput="calcular()">
      <input class="cUnit" type="number" value="${v.unit||''}" placeholder="0" oninput="calcular()">
      <div class="totalCell" id="t${i}">R$0</div>
      <input class="cPix" type="number" value="${v.pix||''}" placeholder="0" oninput="calcular()">
      <input class="cDh" type="number" value="${v.dh||''}" placeholder="0" oninput="calcular()">
      <input class="cCart" type="number" value="${v.cart||''}" placeholder="0" oninput="calcular()">
      <div class="fiCell" id="f${i}">R$0</div>
    </div>`;
  });
  document.getElementById('lista').innerHTML=html;
  calcular();
}
function addLinha(n){salvarNaMemoria();for(let i=0;i<n;i++)dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});montar();}
function remover(){salvarNaMemoria();if(dados.length>1)dados.pop();montar();}
function calcular(){
  let gVend=0,aVend=0,sPix=0,sDh=0,sCart=0,sFiado=0,sGeral=0;
  document.querySelectorAll('#lista.linha').forEach((l,i)=>{
    let qtd=Number(l.querySelector('.cQtd').value)||0;
    let unit=Number(l.querySelector('.cUnit').value)||0;
    let pix=Number(l.querySelector('.cPix').value)||0;
    let dh=Number(l.querySelector('.cDh').value)||0;
    let cart=Number(l.querySelector('.cCart').value)||0;
    let prod=l.querySelector('.cProd').value;
    let tot=qtd*unit;
    let fiado=tot-pix-dh-cart;
    if(fiado<0)fiado=0;
    if(prod=='G')gVend+=qtd;else aVend+=qtd;
    sPix+=pix;sDh+=dh;sCart+=cart;sFiado+=fiado;sGeral+=tot;
    document.getElementById('t'+i).innerText='R$'+tot;
    document.getElementById('f'+i).innerText='R$'+fiado;
  });
  let restoGas=estoqueInicialGas-gVend;
  let restoAgua=estoqueInicialAgua-aVend;
  if(document.activeElement.id!=='gCheio')document.getElementById('gCheio').value=restoGas<0?0:restoGas;
  if(document.activeElement.id!=='aCheia')document.getElementById('aCheia').value=restoAgua<0?0:restoAgua;
  document.getElementById('gVazio').innerText=gVend;
  document.getElementById('gVendido').innerText=gVend;
  document.getElementById('aVazia').innerText=aVend;
  document.getElementById('aVendida').innerText=aVend;
  document.getElementById('sPix').innerText=sPix;
  document.getElementById('sDH').innerText=sDh;
  document.getElementById('sCart').innerText=sCart;
  document.getElementById('sFiado').innerText=sFiado;
  document.getElementById('sGeral').innerText=sGeral;
  let desp=Number(document.getElementById('despValor').value)||0;
  document.getElementById('sDesp').innerText=desp;
  document.getElementById('sLucro').innerText=(sPix+sDh+sCart-desp);
  salvarNaMemoria();
  localStorage.setItem('estGas',estoqueInicialGas);
  localStorage.setItem('estAgua',estoqueInicialAgua);
}
function zerar(){if(confirm('Zerar vendas?')){dados=[];for(let i=0;i<5;i++)dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});localStorage.setItem('dadosFolha',JSON.stringify(dados));montar();}}
function limparTudo(){if(confirm('Limpar tudo mesmo?')){localStorage.clear();location.reload();}}
function salvar(){salvarNaMemoria();alert('Salvo!');}
function zap(){
  let m=`*EL SHADAY* ${new Date().toLocaleDateString('pt-BR')}\nGAS Cheio ${document.getElementById('gCheio').value} Vendido ${document.getElementById('gVendido').innerText} | AGUA ${document.getElementById('aCheia').value} Vendida ${document.getElementById('aVendida').innerText}\n\n`;
  document.querySelectorAll('#lista.linha').forEach(l=>{
    let cli=l.querySelector('.cCliente').value;let qtd=l.querySelector('.cQtd').value;let unit=l.querySelector('.cUnit').value;
    let tot=l.querySelector('.totalCell').innerText;let fiado=l.querySelector('.fiCell').innerText;
    if(cli&&qtd)m+=`${cli} ${qtd}x R$${unit} = ${tot} ${fiado!='R$0'?'❌'+fiado:''}\n`;
  });
  m+=`\nPIX R$${document.getElementById('sPix').innerText} DH R$${document.getElementById('sDH').innerText} CART R$${document.getElementById('sCart').innerText} FIADO R$${document.getElementById('sFiado').innerText} TOTAL R$${document.getElementById('sGeral').innerText}`;
  window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank');
}
function gerarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('l','mm','a4');
  let rows=[]; let listaFiado=[]; let totalGasQtd=0, totalPixValor=0, totalFiadoValor=0;
  document.querySelectorAll('#lista.linha').forEach(l=>{
    let c=l.querySelector('.cCliente').value;
    let p=l.querySelector('.cProd').value;
    let q=Number(l.querySelector('.cQtd').value)||0;
    let u=l.querySelector('.cUnit').value;
    let t=l.querySelector('.totalCell').innerText;
    let pixVal=Number(l.querySelector('.cPix').value)||0;
    let fiadoTxt=l.querySelector('.fiCell').innerText;
    let fiadoVal=Number(fiadoTxt.replace('R$',''))||0;
    if(q){
      if(p=='G')totalGasQtd+=q;
      totalPixValor+=pixVal;
      totalFiadoValor+=fiadoVal;
      if(fiadoVal>0)listaFiado.push({nome:c||'Sem nome',valor:fiadoVal});
      rows.push([c,p,q,'R$'+u,t,'R$'+pixVal,'R$'+l.querySelector('.cDh').value,'R$'+l.querySelector('.cCart').value,fiadoTxt]);
    }
  });
  if(!rows.length){alert('Sem vendas');return;}
  doc.setFontSize(12);
  doc.text('EL SHADAY - '+new Date().toLocaleDateString('pt-BR'),14,10);
  const cores=[[255,235,59],[66,66,66],[76,175,80],[97,97,97],[255,235,59],[33,150,243],[76,175,80],[156,39,176],[229,57,53]];
  doc.autoTable({
    head:[['Cliente','Prod','Qtd','Unit','Total','PIX','DH','CART','FIADO']],
    body:rows,
    startY:15,
    headStyles:{fillColor:[13,71,161],textColor:255,fontStyle:'bold'},
    styles:{fontSize:9,halign:'center',valign:'middle'},
    didParseCell:function(data){
      if(data.section==='body'){
        let col=data.column.index;
        if(cores[col]){
          data.cell.styles.fillColor=cores[col];
          if(col===1||col===3||col===5||col===7||col===8)data.cell.styles.textColor=[255,255,255];
          else data.cell.styles.textColor=[0,0,0];
        }
      }
    }
  });
  let finalY=doc.lastAutoTable.finalY+8;
  let pageW=277,gap=4,boxW=(pageW-(gap*3))/4,boxH=24,startX=10;
  // 1 GAS CINZA
  doc.setFillColor(97,97,97);doc.rect(startX,finalY,boxW,boxH,'FD');
  doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont(undefined,'bold');
  doc.text('GAS VENDIDO QTD',startX+4,finalY+7);doc.setFontSize(13);doc.text(totalGasQtd+' unid.',startX+4,finalY+17);
  // 2 PIX AZUL
  doc.setFillColor(33,150,243);doc.rect(startX+boxW+gap,finalY,boxW,boxH,'FD');
  doc.setFontSize(8);doc.text('VALOR EM PIX',startX+boxW+gap+4,finalY+7);doc.setFontSize(12);doc.text('R$ '+totalPixValor,startX+boxW+gap+4,finalY+17);
  // 3 FIADO VERDE
  doc.setFillColor(46,125,50);doc.rect(startX+(boxW+gap)*2,finalY,boxW,boxH,'FD');
  doc.setFontSize(8);doc.text('A RECEBER (FIADO)',startX+(boxW+gap)*2+4,finalY+7);doc.setFontSize(12);doc.text('R$ '+totalFiadoValor,startX+(boxW+gap)*2+4,finalY+17);
  // 4 QUEM DEVE CINZA ESCURO ALINHADO
  doc.setFillColor(66,66,66);doc.rect(startX+(boxW+gap)*3,finalY,boxW,boxH,'FD');
  doc.setFontSize(8);doc.text('QUEM ESTA DEVENDO',startX+(boxW+gap)*3+4,finalY+7);doc.setFontSize(7);doc.setFont(undefined,'normal');
  if(listaFiado.length==0)doc.text('Nenhum',startX+(boxW+gap)*3+4,finalY+16);
  else{let texto=listaFiado.map(f=>`${f.nome} R$${f.valor}`).join(', ');let linhas=doc.splitTextToSize(texto,boxW-8);doc.text(linhas[0]+(linhas.length>1?'...':''),startX+(boxW+gap)*3+4,finalY+16);}
  doc.save('elshaday.pdf');
}
window.onload=iniciar;
</script>
</body>
</html>

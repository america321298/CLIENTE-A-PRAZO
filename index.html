<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EL SHADAY GAS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f5}
.topo{background:#1a7a34;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.card{background:#fff;margin:8px;padding:10px;border-radius:12px;box-shadow:0 2px 6px #0002}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.b{border:2px solid #ddd;border-radius:10px;padding:8px;text-align:center;background:#fff}
.b b{font-size:22px;display:block}
input.t{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:16px}
input.n{width:68px;padding:7px;border-radius:6px;border:1px solid #ccc;text-align:center}
.btn{border:none;border-radius:8px;padding:9px 12px;color:#fff;font-weight:bold}
.linha{display:grid;grid-template-columns:1.4fr.6fr.6fr.6fr.9fr.7fr.7fr;gap:3px;margin:4px 0;align-items:center}
</style>
</head>
<body>
<div class="topo">
<span>🔥 EL SHADAY GÁS E ÁGUA 💧</span>
<button onclick="shareApp()" style="background:#fff;color:#1a7a34;border:none;padding:7px 12px;border-radius:20px;font-weight:bold">📤 Compartilhar</button>
</div>
<div class="card"><input id="data" type="date" style="width:100%;padding:10px;font-size:16px" onchange="load()"></div>
<div class="card"><div class="grid">
<div class="b" style="border-color:#1a7a34"><small>🔥 GÁS CHEIO</small><b id="gCheio">0</b></div>
<div class="b"><small>🫙 GÁS VAZIO</small><b id="gVazio">0</b></div>
<div class="b" style="background:#e8f5e9"><small>📦 VENDIDO</small><b id="gVend">0</b></div>
<div class="b" style="border-color:#0288d1"><small>💧 ÁGUA CHEIA</small><b id="aCheia">0</b></div>
<div class="b"><small>💧 VAZIA</small><b id="aVazia">0</b></div>
<div class="b"><small>📦 VENDIDA</small><b id="aVend">0</b></div>
</div></div>
<div class="card"><div style="background:#ffeb3b;padding:6px;border-radius:6px;display:grid;grid-template-columns:1.4fr.6fr.6fr.6fr.9fr.7fr.7fr;gap:3px;font-weight:bold;font-size:12px;text-align:center"><span>CLIENTE</span><span>PROD</span><span>QTD</span><span>UNIT</span><span>TOTAL</span><span>PIX</span><span>DH</span></div><div id="lista"></div><div style="font-size:11px;color:#666;margin-top:6px">Data: <span id="infoData"></span> | Gás Rest: <span id="gRest"></span> | Água Rest: <span id="aRest"></span></div></div>
<div class="card"><div style="display:flex;gap:6px"><div style="flex:1;background:#2196f3;color:#fff;padding:10px;border-radius:8px">💰 PIX: R$ <b id="tPix">0</b></div><div style="flex:1;background:#4caf50;color:#fff;padding:10px;border-radius:8px">💵 DH: R$ <b id="tDH">0</b></div></div><div style="background:#0d47a1;color:#fff;padding:12px;border-radius:8px;margin-top:6px">📦 TOTAL GERAL: R$ <b id="tGeral">0</b></div></div>
<div class="card" style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn" style="background:#4caf50" onclick="add()">+ Venda</button>
<button class="btn" style="background:#ff9800" onclick="addFolha()">+ 10 Folha</button>
<button class="btn" style="background:#0d47a1" onclick="save()">💾 Salvar</button>
<button class="btn" style="background:#d32f2f" onclick="zerar()">🗑️ ZERAR</button>
<button class="btn" style="background:#333" onclick="window.print()">📄 PDF</button>
</div>
<script>
let ESTOQUE={gas:200,agua:150};let DB=JSON.parse(localStorage.getItem('ELSHADAY_DB')||'{}');let dataEl=document.getElementById('data');dataEl.valueAsDate=new Date();
function getDia(){return dataEl.value}function load(){let d=getDia();if(!DB[d])DB[d]=[{cliente:'',prod:'GJ',qtd:0,unit:110,total:0,pix:0,dh:0}];render();}
function add(){DB[getDia()].push({cliente:'',prod:'GJ',qtd:0,unit:110,total:0,pix:0,dh:0});render();}
function addFolha(){for(let i=0;i<10;i++)DB[getDia()].push({cliente:'',prod:'GJ',qtd:0,unit:0,total:0,pix:0,dh:0});render();}
function save(){localStorage.setItem('ELSHADAY_DB',JSON.stringify(DB));alert('Salvo!');}
function render(){let dia=getDia();let arr=DB[dia]||[];let gV=0,aV=0,tPix=0,tDH=0;let html='';arr.forEach((v,i)=>{v.total=(Number(v.qtd)||0)*(Number(v.unit)||0);if(v.prod==='GJ'){gV+=Number(v.qtd)||0}else{aV+=Number(v.qtd)||0}tPix+=Number(v.pix)||0;tDH+=Number(v.dh)||0;html+=`<div class="linha"><input class="t" type="text" inputmode="text" placeholder="Nome cliente" value="${v.cliente}" oninput="DB['${dia}'][${i}].cliente=this.value"><select style="padding:7px;border-radius:6px" onchange="DB['${dia}'][${i}].prod=this.value;render()"><option value="GJ" ${v.prod==='GJ'?'selected':''}>GJ</option><option value="AG" ${v.prod==='AG'?'selected':''}>AG</option></select><input class="n" type="number" value="${v.qtd}" oninput="DB['${dia}'][${i}].qtd=this.value;render()"><input class="n" type="number" value="${v.unit}" oninput="DB['${dia}'][${i}].unit=this.value;render()"><div style="background:#fff9c4;padding:6px;border-radius:6px;text-align:center;font-size:12px">R$ ${v.total}</div><input class="n" type="number" value="${v.pix}" oninput="DB['${dia}'][${i}].pix=this.value;render()"><input class="n" type="number" value="${v.dh}" oninput="DB['${dia}'][${i}].dh=this.value;render()"></div>`;});document.getElementById('lista').innerHTML=html;let gCheioRest=ESTOQUE.gas-gV;let aCheiaRest=ESTOQUE.agua-aV;document.getElementById('gCheio').innerText=gCheioRest;document.getElementById('gVazio').innerText=gV;document.getElementById('gVend').innerText=gV;document.getElementById('aCheia').innerText=aCheiaRest;document.getElementById('aVazia').innerText=aV;document.getElementById('aVend').innerText=aV;document.getElementById('tPix').innerText=tPix;document.getElementById('tDH').innerText=tDH;document.getElementById('tGeral').innerText=tPix+tDH;document.getElementById('infoData').innerText=dia.split('-').reverse().join('/');document.getElementById('gRest').innerText=gCheioRest;document.getElementById('aRest').innerText=aCheiaRest;localStorage.setItem('ELSHADAY_DB',JSON.stringify(DB));}
function zerar(){if(confirm('Zerar hoje?')){DB[getDia()]=[];render();}}
function shareApp(){let url=location.href;if(navigator.share){navigator.share({title:'EL SHADAY GAS',text:'App controle',url:url})}else{navigator.clipboard.writeText(url);alert('Link copiado: '+url)}}
load();
</script>
</body>
</html>

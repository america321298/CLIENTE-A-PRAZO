<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Shaday Gas</title><style>body{background:#0a1020;color:#fff;font-family:Arial;margin:0}.h{background:#1a2f6b;padding:12px;display:flex;align-items:center;gap:8px}.fab{position:fixed;right:20px;bottom:20px;width:70px;height:70px;border-radius:50%;background:#2f6bff;color:#fff;font-size:40px;border:0;z-index:10}.modal{position:fixed;inset:0;background:#000e;display:none;z-index:20;padding:10px;overflow:auto}.modal.on{display:block}.box{background:#1e2e5a;border-radius:14px;padding:14px}.inp{width:100%;padding:12px;border-radius:10px;border:0;background:#0f1a33;color:#fff;margin-top:8px}.btn{width:100%;padding:12px;border-radius:10px;border:0;background:#2f6bff;color:#fff;font-weight:900;margin-top:10px}.card{background:#1e2e5a;margin:10px;border-radius:12px;padding:12px}</style></head><body>
<div class="h">🔥 <b>EL SHADAY GAS</b></div>
<div class="card"><input id="busca" class="inp" placeholder="Buscar..." oninput="ver()"><div id="lista"></div></div>
<button class="fab" onclick="abrir()">+</button>
<div id="modal" class="modal"><div class="box">
<h3 id="tit">Novo Cliente</h3>
<input id="nome" class="inp" placeholder="Nome *">
<input id="zap" class="inp" placeholder="Zap 83999999999">
<input id="end" class="inp" placeholder="Endereço">
<input id="bairro" class="inp" placeholder="Bairro">
<div style="border:1px dashed #2f6bff;padding:8px;border-radius:10px;margin-top:8px">
<b style="font-size:11px;color:#60a5fa">📍 LOCALIZAÇÃO</b><br>
<input id="lat" class="inp" placeholder="Latitude"><input id="lng" class="inp" placeholder="Longitude">
<button class="inp" style="background:#22c55e" onclick="gps()">📍 Usar meu GPS agora</button>
<input id="link" class="inp" placeholder="Cole link do Google Maps" oninput="linkMap()">
<div id="prev"></div>
</div>
<input id="dev" class="inp" type="number" placeholder="Valor devendo R$">
<button class="btn" onclick="salvar()">💾 SALVAR CLIENTE</button>
<button class="btn" style="background:#334173" onclick="fechar()">Cancelar</button>
<button id="del" class="btn" style="background:#ef4444;display:none" onclick="excluir()">Excluir</button>
</div></div>
<script>
var cs=JSON.parse(localStorage.getItem('esc')||'[]');var edit=null;
function save(){localStorage.setItem('esc',JSON.stringify(cs));}
function abrir(){edit=null;document.getElementById('tit').innerText='Novo Cliente';['nome','zap','end','bairro','lat','lng','link','dev'].forEach(i=>document.getElementById(i).value='');document.getElementById('del').style.display='none';document.getElementById('prev').innerHTML='';document.getElementById('modal').classList.add('on');}
function fechar(){document.getElementById('modal').classList.remove('on');}
function gps(){navigator.geolocation.getCurrentPosition(p=>{document.getElementById('lat').value=p.coords.latitude.toFixed(6);document.getElementById('lng').value=p.coords.longitude.toFixed(6);previa();},()=>alert('Ative o GPS'));}
function previa(){var a=document.getElementById('lat').value,b=document.getElementById('lng').value;if(!a)return;document.getElementById('prev').innerHTML='<a href="https://www.google.com/maps?q='+a+','+b+'" target="_blank" style="color:#60a5fa">📍 Ver no Maps: '+a+','+b+'</a>';}
function linkMap(){var v=document.getElementById('link').value;var m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m){document.getElementById('lat').value=m[1];document.getElementById('lng').value=m[2];previa();}}
function salvar(){var n=document.getElementById('nome').value;if(!n){alert('Nome');return;}var o={id:edit||Date.now(),nome:n,zap:document.getElementById('zap').value,end:document.getElementById('end').value,bairro:document.getElementById('bairro').value,lat:document.getElementById('lat').value,lng:document.getElementById('lng').value,dev:parseFloat(document.getElementById('dev').value)||0};if(edit){var i=cs.findIndex(x=>x.id==edit);cs[i]=o;}else cs.push(o);save();fechar();ver();}
function editar(id){var c=cs.find(x=>x.id==id);edit=id;document.getElementById('tit').innerText='Editar';document.getElementById('nome').value=c.nome;document.getElementById('zap').value=c.zap;document.getElementById('end').value=c.end;document.getElementById('bairro').value=c.bairro;document.getElementById('lat').value=c.lat||'';document.getElementById('lng').value=c.lng||'';document.getElementById('dev').value=c.dev;document.getElementById('del').style.display='block';previa();document.getElementById('modal').classList.add('on');}
function excluir(){if(confirm('Excluir?')){cs=cs.filter(x=>x.id!=edit);save();fechar();ver();}}
function ver(){var b=(document.getElementById('busca').value||'').toLowerCase();var f=cs.filter(c=>(c.nome+c.bairro+c.end).toLowerCase().includes(b));document.getElementById('lista').innerHTML=f.map(c=>'<div class="card" style="background:#0f1a33" onclick="editar('+c.id+')"><b>'+c.nome+' '+(c.lat?'📍':'')+'</b><br><small>'+c.bairro+' - '+c.end+' | Deve R$ '+c.dev.toFixed(2)+'</small><br><div style="margin-top:6px"><a href="https://wa.me/55'+c.zap+'" target="_blank" onclick="event.stopPropagation()" style="background:#22c55e;color:#fff;padding:6px 10px;border-radius:15px;text-decoration:none">🟢 Zap</a> '+(c.lat?'<a href="https://www.google.com/maps?q='+c.lat+','+c.lng+'" target="_blank" onclick="event.stopPropagation()" style="background:#334173;color:#fff;padding:6px 10px;border-radius:15px;text-decoration:none">📍 Ver</a> <a href="https://www.google.com/maps/dir/?api=1&destination='+c.lat+','+c.lng+'" target="_blank" onclick="event.stopPropagation()" style="background:#2f6bff;color:#fff;padding:6px 10px;border-radius:15px;text-decoration:none">🚗 Rota</a>':'')+'</div></div>').join('')||'<p style="text-align:center;opacity:.5;padding:20px">Nenhum cliente<br>Clique no + azul para adicionar</p>';}
ver();
</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>EL SHADAY - FIX TOTAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f0f0}
.titulo{background:#1a7a34;color:#fff;text-align:center;padding:12px;font-weight:bold;font-size:16px}
.estoque{margin:4px;background:#fff;border-radius:8px;padding:6px;border:2px solid #0d47a1}
.linha-unica{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:4px}
.top{padding:6px;border-radius:6px;text-align:center;font-size:8px;font-weight:bold;color:#fff}
.top b{font-size:15px;display:block;margin-top:2px}
.top input{width:100%;background:#fff;color:#000;border:2px solid #000;border-radius:4px;text-align:center;font-size:18px;font-weight:bold;padding:3px;margin-top:3px}
.top.gas{background:#0d47a1}.top.agua{background:#0288d1}
.top.white-gas{background:#e3f2fd;color:#0d47a1;border:1.5px solid #0d47a1}
.top.white-agua{background:#e1f5fe;color:#0288d1;border:1.5px solid #0288d1}
.top.white-gas b,.top.white-agua b{color:#000;font-size:16px}
.card{margin:4px;background:#fff;border-radius:8px;padding:4px;border:1.5px solid #0d47a1}
.wrap{overflow-x:auto}.tabela{width:100%;min-width:760px}
.th{display:grid;grid-template-columns:100px 70px 44px 48px 58px 42px 42px 42px 48px;gap:2px;font-size:8px;font-weight:bold;text-align:center}
.th span{padding:4px;border-radius:4px;color:#fff}
.linha{display:grid;grid-template-columns:100px 70px 44px 48px 58px 42px 42px 42px 48px;gap:2px;margin:2px 0}
.linha input,.linha select{height:36px;border:1.5px solid #888;border-radius:5px;text-align:center;font-size:12px;font-weight:bold;width:100%}
.totalCell{background:#ffeb3b;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #999;border-radius:5px;font-weight:bold;font-size:11px}
.fiCell{background:#ffcdd2;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #999;border-radius:5px;font-weight:bold;font-size:11px}
.sum{padding:8px;border-radius:6px;color:#fff;font-weight:bold;display:flex;justify-content:space-between;margin:2px;font-size:13px}
.btn{border:none;border-radius:6px;padding:10px 4px;color:#fff;font-weight:bold;font-size:11px;cursor:pointer}
.bot{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px}
.resumo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px}
</style>
</head>
<body>
<div class="titulo">🔥 EL SHADAY GÁS E ÁGUA 💧</div>
<div class="estoque">
<div style="font-size:11px;font-weight:bold;text-align:center;margin-bottom:4px;color:#0d47a1">ESTOQUE</div>
<div class="linha-unica">
<div class="top gas">GÁS CHEIO<input id="gCheio" type="number" value="200" oninput="atualizarInicial('gas')"></div>
<div class="top white-gas">GÁS VAZIO<b id="gVazio">0</b></div>
<div class="top white-gas">GÁS VENDIDO<b id="gVendido">0</b></div>
<div class="top agua">ÁGUA CHEIA<input id="aCheia" type="number" value="150" oninput="atualizarInicial('agua')"></div>
<div class="top white-agua">ÁGUA VAZIA<b id="aVazia">0</b></div>
<div class="top white-agua">ÁGUA VENDIDA<b id="aVendida">0</b></div>
</div>
</div>
<div class="card">
<div style="background:#ffeb3b;text-align:center;font-weight:bold;padding:6px;border-radius:6px">FOLHA DE CADERNO</div>
<div class="wrap"><div class="tabela">
<div class="th">
<span style="background:#ffeb3b;color:#000">Cliente</span><span style="background:#000">Produto</span><span style="background:#4caf50">Qtd</span><span style="background:#222">Unit</span><span style="background:#ff9800;color:#000">Total</span><span style="background:#2196f3">PIX</span><span style="background:#4caf50">DH</span><span style="background:#9c27b0">CART</span><span style="background:#e53935">FIADO</span>
</div>
<div id="lista"></div>
</div></div>
<div class="resumo" id="resumo"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<button class="btn" style="background:#29b6f6" onclick="addLinha(5)">+5 Vendas</button>
<button class="btn" style="background:#2e7d32" onclick="addLinha(1)">+1 Venda</button>
</div>
</div>
<div class="bot">
<button class="btn" style="background:#000" onclick="gerarPDF()">PDF</button>
<button class="btn" style="background:#c62828" onclick="zerar()">ZERAR</button>
<button class="btn" style="background:#607d8b" onclick="location.reload()">Atualizar</button>
<button class="btn" style="background:#0d47a1" onclick="zerarEstoque()">Zerar Estoque</button>
</div>
<script>
// CÓDIGO CORRIGIDO - SELETOR #lista.linha
let estoqueInicialGas=200, estoqueInicialAgua=150, dados=[];
function iniciar(){
  estoqueInicialGas=parseInt(localStorage.getItem('estGasInicial')||'200');
  estoqueInicialAgua=parseInt(localStorage.getItem('estAguaInicial')||'150');
  dados=JSON.parse(localStorage.getItem('dadosFolha')||'[]');
  if(dados.length==0){for(let i=0;i<5;i++)dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});}
  montar();
}
function atualizarInicial(tipo){
  const vend = getVendidos();
  if(tipo==='gas'){
    let restante = Number(document.getElementById('gCheio').value)||0;
    estoqueInicialGas = restante + vend.g;
    localStorage.setItem('estGasInicial', estoqueInicialGas);
  } else {
    let restante = Number(document.getElementById('aCheia').value)||0;
    estoqueInicialAgua = restante + vend.a;
    localStorage.setItem('estAguaInicial', estoqueInicialAgua);
  }
  calcular(false);
}
function getVendidos(){
  let g=0,a=0;
  document.querySelectorAll('#lista.linha').forEach(l=>{
    let q=Number(l.querySelector('.cQtd').value)||0;
    let prod=l.querySelector('.cProd').value;
    if(prod==='G') g+=q; else a+=q;
  });
  return {g,a};
}
function salvarNaMemoria(){
  let novo=[];
  document.querySelectorAll('#lista.linha').forEach(l=>{
    novo.push({
      cliente:l.querySelector('.cCliente').value,
      prod:l.querySelector('.cProd').value,
      qtd:l.querySelector('.cQtd').value,
      unit:l.querySelector('.cUnit').value,
      pix:l.querySelector('.cPix').value,
      dh:l.querySelector('.cDh').value,
      cart:l.querySelector('.cCart').value
    });
  });
  dados=novo;
  localStorage.setItem('dadosFolha',JSON.stringify(dados));
}
function montar(){
  let html='';
  dados.forEach((v,i)=>{
    html+=`<div class="linha">
      <input class="cCliente" value="${(v.cliente||'').replace(/"/g,'&quot;')}" placeholder="Cliente" oninput="calcular()">
      <select class="cProd" onchange="calcular()"><option value="G" ${v.prod==='A'?'':'selected'}>GÁS</option><option value="A" ${v.prod==='A'?'selected':''}>ÁGUA</option></select>
      <input class="cQtd" type="number" value="${v.qtd||''}" placeholder="0" oninput="calcular()">
      <input class="cUnit" type="number" value="${v.unit||''}" placeholder="0" oninput="calcular()">
      <div class="totalCell" id="t${i}">R$0</div>
      <input class="cPix" type="number" value="${v.pix||''}" placeholder="0" oninput="calcular()">
      <input class="cDh" type="number" value="${v.dh||''}" placeholder="0" oninput="calcular()">
      <input class="cCart" type="number" value="${v.cart||''}" placeholder="0" oninput="calcular()">
      <div class="fiCell" id="f${i}">R$0</div>
    </div>`;
  });
  document.getElementById('lista').innerHTML=html;
  calcular(true);
}
function addLinha(n){
  salvarNaMemoria();
  for(let i=0;i<n;i++) dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});
  montar();
}
function calcular(atualizarEstoque=true){
  let gVend=0,aVend=0,totalGeral=0,totalPix=0,totalDH=0,totalCart=0,totalFiado=0;
  document.querySelectorAll('#lista.linha').forEach((l,i)=>{
    let qtd=Number(l.querySelector('.cQtd').value)||0;
    let unit=Number(l.querySelector('.cUnit').value)||0;
    let pix=Number(l.querySelector('.cPix').value)||0;
    let dh=Number(l.querySelector('.cDh').value)||0;
    let cart=Number(l.querySelector('.cCart').value)||0;
    let prod=l.querySelector('.cProd').value;
    let tot=qtd*unit;
    let fiado=tot-pix-dh-cart;
    if(fiado<0) fiado=0;
    if(prod=='G') gVend+=qtd; else aVend+=qtd;
    totalGeral+=tot; totalPix+=pix; totalDH+=dh; totalCart+=cart; totalFiado+=fiado;
    document.getElementById('t'+i).innerText='R$'+tot.toFixed(0);
    document.getElementById('f'+i).innerText='R$'+fiado.toFixed(0);
    document.getElementById('f'+i).style.background = fiado>0? '#ffcdd2' : '#c8e6c9';
  });
  if(atualizarEstoque){
    let restoGas=estoqueInicialGas-gVend;
    let restoAgua=estoqueInicialAgua-aVend;
    if(document.activeElement.id!=='gCheio') document.getElementById('gCheio').value=restoGas<0?0:restoGas;
    if(document.activeElement.id!=='aCheia') document.getElementById('aCheia').value=restoAgua<0?0:restoAgua;
  }
  document.getElementById('gVazio').innerText=gVend;
  document.getElementById('gVendido').innerText=gVend;
  document.getElementById('aVazia').innerText=aVend;
  document.getElementById('aVendida').innerText=aVend;
  document.getElementById('resumo').innerHTML=`
    <div class="sum" style="background:#000">GERAL R$${totalGeral}</div>
    <div class="sum" style="background:#2196f3">PIX R$${totalPix}</div>
    <div class="sum" style="background:#e53935">FIADO R$${totalFiado}</div>
  `;
  salvarNaMemoria();
}
function zerar(){
  if(confirm('Zerar todas as vendas de hoje?')){
    dados=[];
    for(let i=0;i<5;i++) dados.push({cliente:'',prod:'G',qtd:'',unit:'',pix:'',dh:'',cart:''});
    localStorage.setItem('dadosFolha',JSON.stringify(dados));
    montar();
  }
}
function zerarEstoque(){
  if(confirm('Resetar estoque inicial para 200 gás e 150 água?')){
    localStorage.setItem('estGasInicial','200');
    localStorage.setItem('estAguaInicial','150');
    location.reload();
  }
}
function gerarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('l','mm','a4');
  let rows=[],listaFiado=[],totalGasQtd=0,totalAguaQtd=0,totalPix=0,totalDH=0,totalCart=0,totalFiado=0,totalGeral=0;
  document.querySelectorAll('#lista.linha').forEach(l=>{
    let c=l.querySelector('.cCliente').value||'Sem nome';
    let p=l.querySelector('.cProd').value;
    let q=Number(l.querySelector('.cQtd').value)||0;
    let u=l.querySelector('.cUnit').value||0;
    let tot=Number(l.querySelector('.totalCell').innerText.replace('R$',''))||0;
    let pix=Number(l.querySelector('.cPix').value)||0;
    let dh=Number(l.querySelector('.cDh').value)||0;
    let cart=Number(l.querySelector('.cCart').value)||0;
    let fiado=Number(l.querySelector('.fiCell').innerText.replace('R$',''))||0;
    if(q>0){
      if(p=='G') totalGasQtd+=q; else totalAguaQtd+=q;
      totalPix+=pix; totalDH+=dh; totalCart+=cart; totalFiado+=fiado; totalGeral+=tot;
      if(fiado>0) listaFiado.push({nome:c, valor:fiado});
      rows.push([c,p,q,'R$'+u,'R$'+tot,'R$'+pix,'R$'+dh,'R$'+cart,'R$'+fiado]);
    }
  });
  if(!rows.length){alert('Sem vendas para gerar PDF');return;}
  let totalEntrou = totalPix + totalDH + totalCart;
  doc.setFontSize(11);doc.setFont(undefined,'bold');
  doc.text('EL SHADAY - '+new Date().toLocaleDateString('pt-BR')+' - Gas:'+totalGasQtd+' Agua:'+totalAguaQtd,14,10);
  const cores=[[255,235,59],[66,66,66],[76,175,80],[255,255,255],[255,235,59],[33,150,243],[76,175,80],[156,39,176],[46,125,50]];
  doc.autoTable({
    head:[['Cliente','Prod','Qtd','Unit','Total','PIX','DH','CART','FIADO']],
    body:rows,
    startY:14,
    headStyles:{fillColor:[13,71,161],textColor:255,halign:'center'},
    styles:{fontSize:9,halign:'center',valign:'middle',lineColor:[0,0,0],lineWidth:0.1},
    didParseCell:function(data){
      if(data.section==='body'){
        let col=data.column.index;
        if(cores[col]){
          data.cell.styles.fillColor=cores[col];
          if(col===1||col===7) data.cell.styles.textColor=[255,255,255];
          else data.cell.styles.textColor=[0,0,0];
        }
      }
    }
  });
  let finalY=doc.lastAutoTable.finalY+8;
  let pageW=277,gap=4,boxW=(pageW-20-gap*2)/3,boxH=20,startX=10;
  doc.setFillColor(97,97,97); doc.rect(startX,finalY,boxW,boxH,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont(undefined,'bold');
  doc.text('GAS VENDIDO QTD',startX+3,finalY+6);doc.setFontSize(11);doc.text(totalGasQtd+' unid.',startX+3,finalY+14);
  doc.setFillColor(33,150,243); doc.rect(startX+boxW+gap,finalY,boxW,boxH,'F');
  doc.setFontSize(8);doc.text('VALOR EM PIX',startX+boxW+gap+3,finalY+6);doc.setFontSize(11);doc.text('R$ '+totalPix,startX+boxW+gap+3,finalY+14);
  doc.setFillColor(46,125,50); doc.rect(startX+(boxW+gap)*2,finalY,boxW,boxH,'F');
  doc.setFontSize(8);doc.text('DINHEIRO (DH)',startX+(boxW+gap)*2+3,finalY+6);doc.setFontSize(11);doc.text('R$ '+totalDH,startX+(boxW+gap)*2+3,finalY+14);
  let finalY2 = finalY + boxH + 4;
  doc.setFillColor(0,121,107); doc.rect(startX,finalY2,boxW,boxH,'F');
  doc.setFontSize(8);doc.text('TOTAL QUE ENTROU',startX+3,finalY2+6);doc.setFontSize(11);doc.text('R$ '+totalEntrou,startX+3,finalY2+14);
  doc.setFillColor(13,71,161); doc.rect(startX+boxW+gap,finalY2,boxW,boxH,'F');
  doc.setFontSize(8);doc.text('TOTAL GERAL',startX+boxW+gap+3,finalY2+6);doc.setFontSize(11);doc.text('R$ '+totalGeral,startX+boxW+gap+3,finalY2+14);
  doc.setFillColor(66,66,66); doc.rect(startX+(boxW+gap)*2,finalY2,boxW,boxH,'F');
  doc.setFontSize(8);doc.text('QUEM FALTA PAGAR - R$'+totalFiado,startX+(boxW+gap)*2+3,finalY2+6);
  doc.setFontSize(7);doc.setFont(undefined,'normal');
  if(listaFiado.length==0) doc.text('Nenhum devendo',startX+(boxW+gap)*2+3,finalY2+13);
  else {
    let txt = listaFiado.map(f=>`${f.nome} R$${f.valor}`).join(', ');
    let linhas = doc.splitTextToSize(txt, boxW-6);
    doc.text(linhas[0],startX+(boxW+gap)*2+3,finalY2+12);
    if(linhas[1]) doc.text(linhas[1],startX+(boxW+gap)*2+3,finalY2+15);
  }
  doc.save('elshaday-'+new Date().toLocaleDateString('pt-BR')+'.pdf');
}
window.onload=iniciar;
</script>
</body>
</html>
